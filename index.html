<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Angeles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Logo ──────────────────────────────────────────────────────────────────
const logo = new Image();
logo.src = 'NewAngeles-02.png'; // blue on black

logo.onerror = function() {
  // fallback: draw text so we know the canvas is working
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ff0000';
  ctx.font = '40px sans-serif';
  ctx.fillText('Logo failed to load', 50, canvas.height / 2);
};

// ── Sparks ────────────────────────────────────────────────────────────────
var sparks = [];
function spawnSparks(x, y, n, burst) {
  for (var i = 0; i < n; i++) {
    sparks.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * (burst ? 5 : 2.5),
      vy: -(Math.random() * (burst ? 5 : 3) + 0.5),
      life: 1,
      decay: 0.013 + Math.random() * 0.02,
      r: burst ? (2 + Math.random() * 4) : (1 + Math.random() * 2.5),
      hue: 200 + Math.random() * 45
    });
  }
  while (sparks.length > 500) sparks.shift();
}

function tickSparks() {
  for (var i = sparks.length - 1; i >= 0; i--) {
    var s = sparks[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.07;
    s.life -= s.decay;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = s.life * 0.95;
    ctx.shadowBlur = 14;
    ctx.shadowColor = 'hsl(' + s.hue + ',100%,80%)';
    ctx.fillStyle = 'hsl(' + s.hue + ',100%,' + (55 + s.life * 45) + '%)';
    ctx.beginPath();
    ctx.arc(s.x, s.y, Math.max(0.1, s.r * s.life), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ── Layout ────────────────────────────────────────────────────────────────
function getLayout() {
  var W = canvas.width, H = canvas.height;
  var padX = W * 0.08;
  var logoAspect = logo.naturalWidth / logo.naturalHeight || (640/360);
  var drawW = W - padX * 2;
  var drawH = drawW / logoAspect;
  var drawX = padX;
  var drawY = (H - drawH) / 2;
  return { W: W, H: H, drawX: drawX, drawY: drawY, drawW: drawW, drawH: drawH };
}

// ── Neon glow (no ctx.filter — avoids taint/CORS issues) ─────────────────
function drawNeonLogo(fraction, alpha) {
  var l = getLayout();
  var revealX = l.drawX + fraction * l.drawW;
  var clipW = revealX - l.drawX;
  if (clipW <= 0) return;

  ctx.save();
  ctx.beginPath();
  ctx.rect(l.drawX, 0, clipW, l.H);
  ctx.clip();

  // Multiple shadow passes for glow (no filter needed)
  var glowPasses = [
    { alpha: 0.12, blur: 48 },
    { alpha: 0.25, blur: 22 },
    { alpha: 0.50, blur: 8  },
    { alpha: alpha, blur: 0  },
  ];

  for (var i = 0; i < glowPasses.length; i++) {
    var g = glowPasses[i];
    ctx.save();
    ctx.shadowBlur = g.blur;
    ctx.shadowColor = '#3366ff';
    ctx.globalAlpha = g.alpha;
    ctx.drawImage(logo, l.drawX, l.drawY, l.drawW, l.drawH);
    ctx.restore();
  }

  ctx.restore();
}

// ── Animation ─────────────────────────────────────────────────────────────
var T_WRITE = 3000;
var T_SHINE_END = T_WRITE + 900;
var t0 = null;
var prevRX = -1;
var lastTwinkle = 0;

function ease(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

function frame(ts) {
  requestAnimationFrame(frame);
  if (!logo.complete || !logo.naturalWidth) return;

  var l = getLayout();
  if (!t0) t0 = ts;
  var el = ts - t0;

  // Background
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, l.W, l.H);

  // Scanline flicker
  if (Math.random() < 0.015) {
    ctx.save();
    ctx.globalAlpha = 0.04 + Math.random() * 0.04;
    ctx.fillStyle = '#2244ff';
    ctx.fillRect(0, Math.random() * l.H, l.W, 1);
    ctx.restore();
  }

  if (el < T_WRITE) {
    var t = ease(el / T_WRITE);
    drawNeonLogo(t, 1.0);
    var rx = l.drawX + t * l.drawW;
    if (rx - prevRX > 3) {
      spawnSparks(rx, l.drawY + l.drawH * (0.25 + Math.random() * 0.5), 2 + Math.floor(Math.random() * 3), false);
      prevRX = rx;
    }
  } else if (el < T_SHINE_END) {
    drawNeonLogo(1.0, 1.0);
    var st = (el - T_WRITE) / (T_SHINE_END - T_WRITE);
    var shineX = l.drawX - 100 + st * (l.drawW + 250);
    var grad = ctx.createLinearGradient(shineX - 80, 0, shineX + 80, 0);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0.4)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, l.W, l.H);
    ctx.restore();
    if (Math.random() < 0.45) {
      spawnSparks(l.drawX + Math.random() * l.drawW, l.drawY + l.drawH * (0.2 + Math.random() * 0.6), 1 + Math.floor(Math.random() * 3), Math.random() < 0.3);
    }
  } else {
    var idle = el - T_SHINE_END;
    var pulse = 0.86 + 0.14 * Math.sin(idle * 0.0017);
    drawNeonLogo(1.0, pulse);
    if (ts - lastTwinkle > 80 + Math.random() * 200) {
      lastTwinkle = ts;
      spawnSparks(l.drawX + l.drawW * (0.05 + Math.random() * 0.9), l.drawY + l.drawH * (0.1 + Math.random() * 0.8), 1 + (Math.random() < 0.25 ? 3 : 0), Math.random() < 0.2);
    }
  }

  tickSparks();
}

requestAnimationFrame(frame);
</script>
</body>
</html>
