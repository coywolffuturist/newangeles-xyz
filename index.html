<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Angeles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .logo-layer {
      position: absolute;
      top: 50%;
      left: 7%;
      transform: translateY(-50%);
      width: 86%;
      height: auto;
      display: block;
      pointer-events: none;
    }

    /* Each layer is the WHITE-on-black version, colorized with CSS */

    /* Outermost haze — wide blue fog */
    #gl1 {
      filter: blur(60px) invert(1) brightness(0.6)
              sepia(1) saturate(8) hue-rotate(195deg);
      opacity: 0.7;
      mix-blend-mode: screen;
    }
    /* Mid glow */
    #gl2 {
      filter: blur(28px) invert(1) brightness(0.9)
              sepia(1) saturate(10) hue-rotate(200deg);
      opacity: 0.75;
      mix-blend-mode: screen;
    }
    /* Tight corona */
    #gl3 {
      filter: blur(10px) invert(1) brightness(1.2)
              sepia(1) saturate(12) hue-rotate(205deg);
      opacity: 0.85;
      mix-blend-mode: screen;
    }
    /* Hot inner core — near-white center */
    #gl4 {
      filter: blur(3px) invert(1) brightness(1.5)
              sepia(1) saturate(6) hue-rotate(210deg);
      opacity: 0.95;
      mix-blend-mode: screen;
    }
    /* Crisp surface — very slight blue tint */
    #gl5 {
      filter: invert(1) brightness(1.0)
              sepia(1) saturate(3) hue-rotate(210deg);
      opacity: 1.0;
      mix-blend-mode: screen;
    }

    #clip-wrapper {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    #sparkle-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="stage">
  <div id="clip-wrapper">
    <!-- All layers use white-on-black source (05) for CSS glow to work -->
    <img id="gl1" class="logo-layer" src="NewAngeles-05.png" alt="">
    <img id="gl2" class="logo-layer" src="NewAngeles-05.png" alt="">
    <img id="gl3" class="logo-layer" src="NewAngeles-05.png" alt="">
    <img id="gl4" class="logo-layer" src="NewAngeles-05.png" alt="">
    <img id="gl5" class="logo-layer" src="NewAngeles-05.png" alt="">
  </div>
  <canvas id="sparkle-canvas"></canvas>
</div>

<script>
var stage    = document.getElementById('stage');
var wrapper  = document.getElementById('clip-wrapper');
var sparkCvs = document.getElementById('sparkle-canvas');
var sctx     = sparkCvs.getContext('2d');

function resize() {
  sparkCvs.width  = window.innerWidth;
  sparkCvs.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

var refImg = document.getElementById('gl5');

function getLR() {
  var r = refImg.getBoundingClientRect();
  return { x:r.left, y:r.top, w:r.width, h:r.height };
}

// ── Sparks ─────────────────────────────────────────────────────────────────
var sparks = [];
function spawnSparks(x, y, n, burst) {
  for (var i=0; i<n; i++) {
    sparks.push({
      x:x, y:y,
      vx:(Math.random()-0.5)*(burst?8:3.5),
      vy:-(Math.random()*(burst?8:4.5)+0.5),
      life:1,
      decay:0.01+Math.random()*0.017,
      r:burst?(3+Math.random()*5.5):(1.5+Math.random()*3),
      hue:195+Math.random()*60
    });
  }
  while(sparks.length>700) sparks.shift();
}

function tickSparks() {
  sctx.clearRect(0,0,sparkCvs.width,sparkCvs.height);
  for (var i=sparks.length-1; i>=0; i--) {
    var s=sparks[i];
    s.x+=s.vx; s.y+=s.vy; s.vy+=0.08;
    s.life-=s.decay;
    if(s.life<=0){sparks.splice(i,1);continue;}
    var r=Math.max(0.5,s.r*s.life);
    sctx.save();
    sctx.globalAlpha=s.life;
    sctx.shadowBlur=r>2?24:12;
    sctx.shadowColor='hsl('+s.hue+',100%,88%)';
    sctx.fillStyle='hsl('+s.hue+',100%,'+(50+s.life*50)+'%)';
    if(r>2.5){
      sctx.beginPath();
      for(var p=0;p<8;p++){
        var a=p*Math.PI/4, rr=(p%2===0)?r:r*0.28;
        p===0?sctx.moveTo(s.x+Math.cos(a)*rr,s.y+Math.sin(a)*rr):sctx.lineTo(s.x+Math.cos(a)*rr,s.y+Math.sin(a)*rr);
      }
      sctx.closePath();sctx.fill();
    } else {
      sctx.beginPath();sctx.arc(s.x,s.y,r,0,Math.PI*2);sctx.fill();
    }
    sctx.restore();
  }
}

// ── Reveal + opacity ───────────────────────────────────────────────────────
function setReveal(fraction) {
  var lr = getLR();
  var revealPx = lr.x + fraction * lr.w;
  var rightClip = Math.max(0, sparkCvs.width - revealPx);
  wrapper.style.clipPath = 'inset(0 '+rightClip+'px 0 0)';
}

var layers = ['gl1','gl2','gl3','gl4','gl5'];
var baseOp = [0.7, 0.75, 0.85, 0.95, 1.0];

function setOpacity(alpha) {
  for (var i=0; i<layers.length; i++) {
    document.getElementById(layers[i]).style.opacity = (baseOp[i] * alpha).toFixed(3);
  }
}

// Shine overlay div
var shineDiv = document.createElement('div');
shineDiv.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;opacity:0;';
stage.appendChild(shineDiv);

function setShine(frac) {
  if (frac < 0) { shineDiv.style.opacity='0'; return; }
  var lr = getLR();
  var px = lr.x + frac * (lr.w + 200) - 100;
  var pct = (px / sparkCvs.width * 100).toFixed(1);
  shineDiv.style.opacity = '1';
  shineDiv.style.background =
    'linear-gradient(to right,rgba(255,255,255,0) '+(parseFloat(pct)-10)+'%,rgba(255,255,255,0.6) '+pct+'%,rgba(255,255,255,0) '+(parseFloat(pct)+10)+'%)';
}

// ── Animation ──────────────────────────────────────────────────────────────
var T_WRITE=3000, T_SHINE_END=T_WRITE+1000;
var t0=null, prevRX=-1, lastTwinkle=0;
function ease(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}

function frame(ts) {
  requestAnimationFrame(frame);
  if (!refImg.complete || !refImg.naturalWidth) return;
  var lr = getLR();
  if (!lr.w) return;
  if (!t0) t0=ts;
  var el=ts-t0;

  tickSparks();

  if (el < T_WRITE) {
    var t=ease(el/T_WRITE);
    setReveal(t);
    setOpacity(1.0);
    setShine(-1);
    var rx=lr.x+t*lr.w;
    if (rx-prevRX>3) {
      spawnSparks(rx,lr.y+lr.h*(0.2+Math.random()*0.6),3+Math.floor(Math.random()*5),false);
      prevRX=rx;
    }
  } else if (el < T_SHINE_END) {
    setReveal(1.0);
    setOpacity(1.0);
    setShine((el-T_WRITE)/(T_SHINE_END-T_WRITE));
    if(Math.random()<0.55) spawnSparks(lr.x+Math.random()*lr.w,lr.y+lr.h*(0.1+Math.random()*0.8),2+Math.floor(Math.random()*5),Math.random()<0.35);
  } else {
    setReveal(1.0);
    setShine(-1);
    var idle=el-T_SHINE_END;
    var flicker=Math.random()<0.005?(0.45+Math.random()*0.4):1.0;
    var pulse=(0.78+0.22*Math.sin(idle*0.0018))*flicker;
    setOpacity(pulse);
    if (ts-lastTwinkle>70+Math.random()*230) {
      lastTwinkle=ts;
      spawnSparks(lr.x+lr.w*(0.05+Math.random()*0.9),lr.y+lr.h*(0.1+Math.random()*0.8),1+(Math.random()<0.22?5:0),Math.random()<0.18);
    }
  }
}

window.addEventListener('load', function() {
  wrapper.style.clipPath='inset(0 100% 0 0)';
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
