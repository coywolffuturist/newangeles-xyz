  <canvas id="write-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>
</div>
<script src="strokes.js"></script>
<script>
(function(){
'use strict';

var logoStage = document.getElementById('logo-stage');
var logoSvg   = document.getElementById('logo-svg');
var layers    = Array.from(logoSvg.querySelectorAll('g.gl'));
var wc  = document.getElementById('write-canvas');
var wctx = wc.getContext('2d');
var fc  = document.getElementById('fx-canvas');
var fctx = fc.getContext('2d');

function resize(){
  wc.width = fc.width = window.innerWidth;
  wc.height = fc.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function mapPt(px, py){
  var r = logoSvg.getBoundingClientRect();
  return [r.left + (px/640)*r.width, r.top + (py/360)*r.height];
}

function strokeW(){
  return Math.max(1.5, logoSvg.getBoundingClientRect().width * 0.009);
}

function buildTimings(strokes){
  var lens=[], total=0;
  for(var i=0;i<strokes.length;i++){
    var s=strokes[i], l=0;
    for(var j=1;j<s.length;j++){
      var dx=s[j][0]-s[j-1][0], dy=s[j][1]-s[j-1][1];
      l+=Math.sqrt(dx*dx+dy*dy);
    }
    lens.push(l); total+=l;
  }
  return {lens:lens,total:total};
}

function easeInOut(t){
  t=Math.max(0,Math.min(1,t));
  return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
}

function drawWrite(strokes, progress, timing){
  wctx.clearRect(0,0,wc.width,wc.height);
  var drawn=progress*timing.total, cum=0;
  for(var i=0;i<strokes.length;i++){
    var s=strokes[i], sLen=timing.lens[i];
    if(cum>=drawn) break;
    var avail=Math.min(sLen,drawn-cum);
    var pts=s.map(function(p){return mapPt(p[0],p[1]);});
    var segLen=0, drawPts=[pts[0]];
    for(var j=1;j<pts.length;j++){
      var dx=pts[j][0]-pts[j-1][0], dy=pts[j][1]-pts[j-1][1];
      var d=Math.sqrt(dx*dx+dy*dy);
      if(segLen+d>=avail){
        var t=(avail-segLen)/d;
        drawPts.push([pts[j-1][0]+t*dx, pts[j-1][1]+t*dy]);
        break;
      }
      segLen+=d; drawPts.push(pts[j]);
    }
    var sw=strokeW();
    wctx.lineCap='round'; wctx.lineJoin='round';
    // Glow
    wctx.shadowBlur=sw*10; wctx.shadowColor='rgba(50,120,255,0.7)';
    wctx.strokeStyle='rgba(70,140,255,0.35)'; wctx.lineWidth=sw*4;
    wctx.beginPath(); wctx.moveTo(drawPts[0][0],drawPts[0][1]);
    for(var k=1;k<drawPts.length;k++) wctx.lineTo(drawPts[k][0],drawPts[k][1]);
    wctx.stroke();
    // Core
    wctx.shadowBlur=sw*3; wctx.shadowColor='rgba(140,200,255,1)';
    wctx.strokeStyle='rgba(200,230,255,0.98)'; wctx.lineWidth=sw*0.9;
    wctx.beginPath(); wctx.moveTo(drawPts[0][0],drawPts[0][1]);
    for(var k=1;k<drawPts.length;k++) wctx.lineTo(drawPts[k][0],drawPts[k][1]);
    wctx.stroke();
    // Tip spark
    if(drawPts.length>0){
      var tip=drawPts[drawPts.length-1];
      wctx.shadowBlur=sw*8; wctx.shadowColor='#fff';
      wctx.fillStyle='#fff';
      wctx.beginPath(); wctx.arc(tip[0],tip[1],sw*1.4,0,Math.PI*2); wctx.fill();
    }
    cum+=sLen;
  }
}

var pulseStart=0, pulseActive=false;

function fxFrame(){
  fctx.clearRect(0,0,fc.width,fc.height);
  if(Math.random()<0.018){
    fctx.save(); fctx.globalAlpha=0.03+Math.random()*0.05;
    fctx.fillStyle='#1133ff';
    fctx.fillRect(0,Math.random()*fc.height,fc.width,1); fctx.restore();
  }
  if(Math.random()<0.002){
    fctx.save(); fctx.globalAlpha=0.15; fctx.fillStyle='#000';
    fctx.fillRect(0,0,fc.width,fc.height); fctx.restore();
  }
  if(pulseActive){
    var idle=performance.now()-pulseStart;
    var flicker=Math.random()<0.004?(0.5+Math.random()*0.4):1.0;
    var pulse=(0.78+0.22*Math.sin(idle*0.0018))*flicker;
    logoSvg.style.opacity=pulse.toFixed(3);
  }
}

window.addEventListener('load', function(){
  if(typeof STROKES==='undefined'||!STROKES||!STROKES.length){
    // Fallback: just fade in
    logoStage.style.transition='opacity 2s ease';
    logoStage.style.opacity='1';
    pulseActive=true; pulseStart=performance.now();
    requestAnimationFrame(function loop(){ fxFrame(); requestAnimationFrame(loop); });
    return;
  }

  var timing = buildTimings(STROKES);
  var WRITE_DUR = 3800;   // ms to write
  var HOLD_DUR  = 400;    // ms to hold writing before crossfade
  var FADE_DUR  = 1000;   // ms crossfade
  var writeStart = null;

  function loop(ts){
    requestAnimationFrame(loop);
    fxFrame();

    if(!writeStart) writeStart = ts;
    var elapsed = ts - writeStart;

    if(elapsed < WRITE_DUR){
      // Phase 1: draw writing
      var rawP = elapsed / WRITE_DUR;
      var p = easeInOut(rawP);
      drawWrite(STROKES, p, timing);

    } else if(elapsed < WRITE_DUR + HOLD_DUR){
      // Hold at full
      drawWrite(STROKES, 1, timing);

    } else if(elapsed < WRITE_DUR + HOLD_DUR + FADE_DUR){
      // Phase 2: fade neon in, fade writing out
      var fadeP = (elapsed - WRITE_DUR - HOLD_DUR) / FADE_DUR;
      fadeP = Math.min(1, fadeP);
      // Crossfade: writing fades out, neon fades in
      wctx.globalAlpha = 1 - fadeP;
      drawWrite(STROKES, 1, timing);
      wctx.globalAlpha = 1;
      logoStage.style.opacity = fadeP.toFixed(3);

    } else {
      // Phase 3: done — neon at full, writing canvas clear
      wctx.clearRect(0,0,wc.width,wc.height);
      logoStage.style.opacity = '1';
      if(!pulseActive){
        pulseActive = true;
        pulseStart = performance.now();
        logoSvg.style.opacity = '1';
      }
    }
  }

  requestAnimationFrame(loop);
});

}());
</script>
