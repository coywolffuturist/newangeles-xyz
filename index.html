<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Angeles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

var logo = new Image();
logo.src = 'NewAngeles-02.png';

function getLayout() {
  var W = canvas.width, H = canvas.height;
  var padX = W * 0.08;
  var aspect = logo.naturalWidth && logo.naturalHeight ? logo.naturalWidth / logo.naturalHeight : 640/360;
  var drawW = W - padX * 2;
  var drawH = drawW / aspect;
  var drawX = padX;
  var drawY = (H - drawH) / 2;
  return { W:W, H:H, drawX:drawX, drawY:drawY, drawW:drawW, drawH:drawH };
}

// ── Sparks ─────────────────────────────────────────────────────────────────
var sparks = [];
function spawnSparks(x, y, n, burst) {
  for (var i = 0; i < n; i++) {
    sparks.push({
      x:x, y:y,
      vx:(Math.random()-0.5)*(burst?6:2.5),
      vy:-(Math.random()*(burst?6:3.5)+0.5),
      life:1,
      decay:0.011+Math.random()*0.018,
      r:burst?(2.5+Math.random()*4.5):(1+Math.random()*2.5),
      hue:195+Math.random()*50
    });
  }
  while (sparks.length > 600) sparks.shift();
}

function tickSparks() {
  for (var i = sparks.length-1; i >= 0; i--) {
    var s = sparks[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.07;
    s.life -= s.decay;
    if (s.life <= 0) { sparks.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha = s.life;
    ctx.shadowBlur = 16;
    ctx.shadowColor = 'hsl('+s.hue+',100%,80%)';
    ctx.fillStyle = 'hsl('+s.hue+',100%,'+(50+s.life*50)+'%)';
    // 4-point star for larger sparks
    var r = Math.max(0.5, s.r * s.life);
    if (r > 2) {
      ctx.beginPath();
      for (var p=0; p<8; p++) {
        var a = p * Math.PI/4;
        var rr = (p%2===0) ? r : r*0.35;
        var px = s.x + Math.cos(a)*rr, py = s.y + Math.sin(a)*rr;
        p===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(s.x, s.y, r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ── Neon glow draw ─────────────────────────────────────────────────────────
// Draws logo with neon tube effect using multiple shadowBlur passes
function drawNeon(fraction, alpha) {
  var l = getLayout();
  var clipW = fraction * l.drawW;
  if (clipW <= 0) return;

  ctx.save();
  ctx.beginPath();
  ctx.rect(l.drawX, 0, clipW, l.H);
  ctx.clip();

  // Pass 1: Wide outer halo (deep blue fog)
  ctx.save();
  ctx.globalAlpha = alpha * 0.18;
  ctx.shadowBlur = 80;
  ctx.shadowColor = '#0022cc';
  ctx.drawImage(logo, l.drawX, l.drawY, l.drawW, l.drawH);
  ctx.restore();

  // Pass 2: Mid glow
  ctx.save();
  ctx.globalAlpha = alpha * 0.35;
  ctx.shadowBlur = 40;
  ctx.shadowColor = '#1133ee';
  ctx.drawImage(logo, l.drawX, l.drawY, l.drawW, l.drawH);
  ctx.restore();

  // Pass 3: Tight glow
  ctx.save();
  ctx.globalAlpha = alpha * 0.60;
  ctx.shadowBlur = 16;
  ctx.shadowColor = '#2255ff';
  ctx.drawImage(logo, l.drawX, l.drawY, l.drawW, l.drawH);
  ctx.restore();

  // Pass 4: Inner bright core
  ctx.save();
  ctx.globalAlpha = alpha * 0.85;
  ctx.shadowBlur = 6;
  ctx.shadowColor = '#6699ff';
  ctx.drawImage(logo, l.drawX, l.drawY, l.drawW, l.drawH);
  ctx.restore();

  // Pass 5: Crisp core (full alpha)
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowBlur = 2;
  ctx.shadowColor = '#aaccff';
  ctx.drawImage(logo, l.drawX, l.drawY, l.drawW, l.drawH);
  ctx.restore();

  ctx.restore();
}

// ── Animation ──────────────────────────────────────────────────────────────
var T_WRITE     = 3000;
var T_SHINE_END = T_WRITE + 1000;

var t0 = null, prevRX = -1, lastTwinkle = 0;
function ease(t) { return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }

function frame(ts) {
  requestAnimationFrame(frame);
  if (!logo.complete || !logo.naturalWidth) return;
  var l = getLayout();
  if (!t0) t0 = ts;
  var el = ts - t0;

  // Black bg
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, l.W, l.H);

  // Subtle horizontal scanline buzz
  if (Math.random() < 0.018) {
    ctx.save();
    ctx.globalAlpha = 0.03 + Math.random()*0.05;
    ctx.fillStyle = '#1133ff';
    ctx.fillRect(0, Math.random()*l.H, l.W, 1);
    ctx.restore();
  }

  if (el < T_WRITE) {
    // ── Write-on ──
    var t = ease(el / T_WRITE);
    drawNeon(t, 1.0);
    var rx = l.drawX + t * l.drawW;
    if (rx - prevRX > 3) {
      spawnSparks(rx, l.drawY + l.drawH*(0.2+Math.random()*0.6), 2+Math.floor(Math.random()*4), false);
      prevRX = rx;
    }
  } else if (el < T_SHINE_END) {
    // ── Shine sweep ──
    drawNeon(1.0, 1.0);
    var st = (el - T_WRITE) / (T_SHINE_END - T_WRITE);
    var sx = l.drawX - 120 + st * (l.drawW + 280);
    var g = ctx.createLinearGradient(sx-90, 0, sx+90, 0);
    g.addColorStop(0,   'rgba(255,255,255,0)');
    g.addColorStop(0.4, 'rgba(200,220,255,0.3)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.55)');
    g.addColorStop(0.6, 'rgba(200,220,255,0.3)');
    g.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, l.W, l.H);
    ctx.restore();
    // Burst sparks during shine
    if (Math.random() < 0.5) {
      spawnSparks(
        l.drawX + Math.random()*l.drawW,
        l.drawY + l.drawH*(0.15+Math.random()*0.7),
        1+Math.floor(Math.random()*4),
        Math.random()<0.3
      );
    }
  } else {
    // ── Idle breathing ──
    var idle = el - T_SHINE_END;
    // Gentle neon buzz: occasional flicker
    var flicker = Math.random() < 0.003 ? (0.6+Math.random()*0.3) : 1.0;
    var pulse = (0.82 + 0.18 * Math.sin(idle*0.0018)) * flicker;
    drawNeon(1.0, pulse);

    if (ts - lastTwinkle > 60+Math.random()*250) {
      lastTwinkle = ts;
      spawnSparks(
        l.drawX + l.drawW*(0.05+Math.random()*0.9),
        l.drawY + l.drawH*(0.1+Math.random()*0.8),
        1+(Math.random()<0.2?4:0),
        Math.random()<0.15
      );
    }

    // Rare double-flicker (neon buzz)
    if (Math.random() < 0.002) {
      ctx.save();
      ctx.globalAlpha = 0.12;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, l.W, l.H);
      ctx.restore();
    }
  }

  tickSparks();
}

requestAnimationFrame(frame);
</script>
</body>
</html>
