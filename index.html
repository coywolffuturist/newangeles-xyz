<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Angeles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #stage { position: relative; width: 100vw; height: 100vh; }

    #bg-video {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 0; pointer-events: none;
    }

    #logo-stage {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
    }

    #logo-svg {
      position: absolute;
      top: 50%; left: 7%;
      transform: translateY(-50%);
      width: 86%; height: auto;
      display: block; pointer-events: none;
      filter:
        drop-shadow(0 0 32px #0033ff)
        drop-shadow(0 0 16px #1155ff)
        drop-shadow(0 0 6px  #4499ff)
        drop-shadow(0 0 2px  #ffffff);
    }

    canvas#overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 3;
    }
  </style>
</head>
<body>
<div id="stage">
  <video id="bg-video" autoplay loop muted playsinline>
    <source src="bg.mp4" type="video/mp4">
  </video>

  <div id="logo-stage">

      Paths traced directly from NewAngeles-02.png via potrace.
      ViewBox matches potrace output: 6400 x 3600 internal units
      with transform translate(0,3600) scale(1,-1) to flip Y axis.
      Paths are filled shapes — we render as white stroke, no fill,
      then animate with stroke-dashoffset for handwriting reveal.
    -->
    <svg id="logo-svg"
         xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 640 360"
         fill="none"
         stroke="#3366ff"
         stroke-linecap="round"
         stroke-linejoin="round">
      <g id="logo-paths"
         transform="translate(0,360) scale(0.1,-0.1)"
         stroke-width="60"
         opacity="0">

        <path id="lp2" d="M1425 2232 c-68 -38 -129 -79 -275 -190 -71 -54 -140 -99 -160 -103 -100 -24 -286 -40 -424 -38 -151 3 -189 -6 -129 -29 67 -26 158 -35 308 -29 l154 5 -117 -95 c-189 -155 -264 -225 -253 -236 6 -6 101 58 268 180 l258 190 105 21 c124 24 210 36 210 29 0 -3 -84 -189 -186 -414 -185 -406 -332 -735 -425 -951 -46 -106 -53 -142 -27 -126 20 13 572 1144 694 1424 28 64 37 76 63 83 35 9 41 26 10 34 -14 4 -18 11 -13 22 33 81 64 177 64 199 0 59 -46 67 -125 24z m11 -136 c-39 -102 -42 -106 -85 -106 -21 0 -67 -3 -102 -6 l-64 -6 90 63 c122 87 169 118 177 118 4 1 -3 -28 -16 -63z" />

      </g>
    </svg>
  </div>

  <canvas id="overlay"></canvas>
</div>

<script>
(function () {
  'use strict';

  var svg    = document.getElementById('logo-svg');
  var g      = document.getElementById('logo-paths');
  var cvs    = document.getElementById('overlay');
  var ctx    = cvs.getContext('2d');

  function resize() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  function easeInOut(t) {
    t = Math.max(0, Math.min(1, t));
    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
  }

  var pulseActive = false;
  var pulseStart  = 0;

  function drawScanlines() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    if (Math.random() < 0.018) {
      ctx.save();
      ctx.globalAlpha = 0.03 + Math.random() * 0.05;
      ctx.fillStyle = '#1133ff';
      ctx.fillRect(0, Math.random() * cvs.height, cvs.width, 1);
      ctx.restore();
    }
    if (Math.random() < 0.002) {
      ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, cvs.width, cvs.height); ctx.restore();
    }
  }

  function frame() {
    requestAnimationFrame(frame);
    drawScanlines();
    if (pulseActive) {
      var idle    = performance.now() - pulseStart;
      var flicker = Math.random() < 0.004 ? (0.45 + Math.random() * 0.4) : 1.0;
      var pulse   = (0.78 + 0.22 * Math.sin(idle * 0.0018)) * flicker;
      svg.style.opacity = pulse.toFixed(3);
    }
  }

  window.addEventListener('load', function() {
    /* Simple fade-in over 2s, then breathing pulse */
    svg.style.opacity = '0';
    svg.style.transition = 'opacity 2s ease';
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        svg.style.opacity = '1';
        requestAnimationFrame(frame);
        setTimeout(function() {
          svg.style.transition = '';
          pulseActive = true;
          pulseStart  = performance.now();
        }, 2000);
      });
    });
  });

}());
</script>
</body>
</html>
