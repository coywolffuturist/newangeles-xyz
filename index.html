<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Angeles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Logo ──────────────────────────────────────────────────────────────────
const logo = new Image();
logo.crossOrigin = 'anonymous';
logo.src = 'NewAngeles-01.png'; // blue on white — we'll colorize it

// ── Layout ────────────────────────────────────────────────────────────────
function getLayout() {
  const W = canvas.width, H = canvas.height;
  const padX = W * 0.08;
  const logoAspect = 640 / 360;
  const drawW = W - padX * 2;
  const drawH = drawW / logoAspect;
  const drawX = padX;
  const drawY = (H - drawH) / 2;
  return { W, H, drawX, drawY, drawW, drawH };
}

// ── Sparks ────────────────────────────────────────────────────────────────
const sparks = [];
function spawnSparks(x, y, n, burst) {
  for (let i = 0; i < n; i++) {
    sparks.push({
      x, y,
      vx: (Math.random() - 0.5) * (burst ? 5 : 2.5),
      vy: -(Math.random() * (burst ? 5 : 3) + 0.5),
      life: 1,
      decay: 0.013 + Math.random() * 0.02,
      r: burst ? (2 + Math.random() * 4) : (1 + Math.random() * 2.5),
      hue: 200 + Math.random() * 45,
    });
  }
  while (sparks.length > 500) sparks.shift();
}

function tickSparks() {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.07;
    s.life -= s.decay;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = s.life * 0.95;
    ctx.shadowBlur = 12;
    ctx.shadowColor = `hsl(${s.hue},100%,80%)`;
    ctx.fillStyle = `hsl(${s.hue},100%,${55 + s.life * 45}%)`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * s.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ── Main draw ─────────────────────────────────────────────────────────────
const T_WRITE = 3000;
const T_SHINE_END = T_WRITE + 900;

let t0 = null;
let prevRX = null;
let lastTwinkle = 0;

function drawNeonLogo(revealFraction, pulseAlpha) {
  const { W, H, drawX, drawY, drawW, drawH } = getLayout();
  const revealX = drawX + revealFraction * drawW;

  // Draw logo clipped to revealX
  ctx.save();
  ctx.beginPath();
  ctx.rect(drawX, 0, revealX - drawX, H);
  ctx.clip();

  // Outer glow passes
  const glows = [
    { blur: 50, alpha: 0.15, color: '#0033ff' },
    { blur: 25, alpha: 0.28, color: '#1144ff' },
    { blur: 10, alpha: 0.55, color: '#2255ff' },
    { blur: 3,  alpha: 0.80, color: '#4488ff' },
  ];

  for (const g of glows) {
    ctx.save();
    ctx.filter = `blur(${g.blur}px)`;
    ctx.globalAlpha = pulseAlpha * g.alpha;
    ctx.globalCompositeOperation = 'screen';
    ctx.drawImage(logo, drawX, drawY, drawW, drawH);
    ctx.restore();
  }

  // Core — normal render at full opacity
  ctx.save();
  ctx.globalAlpha = pulseAlpha;
  ctx.drawImage(logo, drawX, drawY, drawW, drawH);
  ctx.restore();

  ctx.restore();

  return revealX;
}

function frame(ts) {
  requestAnimationFrame(frame);
  if (!logo.complete || logo.naturalWidth === 0) return;
  if (!t0) { t0 = ts; }

  const { W, H, drawX, drawY, drawW, drawH } = getLayout();
  const el = ts - t0;

  // Black bg
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Occasional bg flicker line (neon buzz)
  if (Math.random() < 0.015) {
    ctx.save();
    ctx.globalAlpha = 0.04 + Math.random() * 0.04;
    ctx.fillStyle = '#2244ff';
    ctx.fillRect(0, Math.random() * H, W, 1);
    ctx.restore();
  }

  if (el < T_WRITE) {
    // Write-on
    const t = el / T_WRITE;
    const eased = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    const revealX = drawNeonLogo(eased, 1.0);

    // Sparks at tip
    if (prevRX === null || revealX - prevRX > 3) {
      const sy = drawY + drawH * (0.2 + Math.random() * 0.6);
      spawnSparks(revealX, sy, 2 + Math.floor(Math.random() * 3), false);
      prevRX = revealX;
    }

  } else if (el < T_SHINE_END) {
    // Full reveal + shine sweep
    drawNeonLogo(1.0, 1.0);

    const st = (el - T_WRITE) / (T_SHINE_END - T_WRITE);
    const shineX = drawX - 100 + st * (drawW + 250);
    const grad = ctx.createLinearGradient(shineX - 80, 0, shineX + 80, 0);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0.45)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    if (Math.random() < 0.45) {
      spawnSparks(
        drawX + Math.random() * drawW,
        drawY + drawH * (0.15 + Math.random() * 0.7),
        1 + Math.floor(Math.random() * 3),
        Math.random() < 0.3
      );
    }

  } else {
    // Breathing idle
    const idle = el - T_SHINE_END;
    const pulse = 0.86 + 0.14 * Math.sin(idle * 0.0017);
    drawNeonLogo(1.0, pulse);

    if (ts - lastTwinkle > 70 + Math.random() * 220) {
      lastTwinkle = ts;
      spawnSparks(
        drawX + drawW * (0.05 + Math.random() * 0.9),
        drawY + drawH * (0.1 + Math.random() * 0.8),
        1 + (Math.random() < 0.25 ? 3 : 0),
        Math.random() < 0.2
      );
    }
  }

  tickSparks();
}

requestAnimationFrame(frame);
</script>
</body>
</html>
